name: Build App From Site
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - name: Check site
        run: curl -fsS -o /dev/null https://ahmed123babeker-tech.github.io/general-bot-/
      - name: Prepare
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body>Loading...</body></html>' > www/index.html
          cat > package.json <<'EOF2'
          {"name":"general-bot","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/core":"^6.1.2"},"devDependencies":{"@capacitor/cli":"^6.1.2"}}
          EOF2
          cat > capacitor.config.json <<'EOF2'
          {"appId":"com.general.bot","appName":"The General Bot","webDir":"www","server":{"url":"https://ahmed123babeker-tech.github.io/general-bot-/"}}
          EOF2
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p
            convert icon-512.png -resize ${2}x${2}^ -gravity center -extent ${2}x${2} $R/mipmap-$1/ic_launcher.png
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_round.png
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeneralBot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
